# Product Catalog CI/CD: Test -> SonarQube -> Nexus -> ECR -> Helm -> EKS
name: Product Catalog CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Prevent concurrent deployments of the same service branch.
concurrency:
  group: productcatalog-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  SERVICE_NAME: productcatalogservice
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '663130434910'
  ECR_REPOSITORY: boutique-productcatalogservice
  EKS_CLUSTER_NAME: boutique-dev-eks
  K8S_NAMESPACE: boutique
  HELM_RELEASE: productcatalog-dev
  K8S_DEPLOYMENT: productcatalogservice
  PLATFORM_REPOSITORY: skmohinudd/boutique-platform-infra
  HELM_CHART_PATH: boutique-platform-infra/helm/productcatalogservice

jobs:
  build-test-deploy:
    name: Build, Analyze, Publish and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      # Checkout complete Git history for accurate SonarQube SCM analysis.
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Install Java 21 and enable Maven dependency caching.
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Allow Maven Wrapper execution on Linux.
      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      # Generate one immutable version for Sonar, Nexus, ECR, Helm and EKS.
      - name: Generate application version
        run: |
          APP_VERSION="1.0.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "Application version: $APP_VERSION"

      # Apply the CI version only inside this temporary runner.
      - name: Set Maven artifact version
        run: |
          ./mvnw --batch-mode --no-transfer-progress \
            versions:set \
            -DnewVersion="${APP_VERSION}" \
            -DgenerateBackupPoms=false

      # Pull requests validate code without publishing artifacts.
      - name: Run Maven tests for pull request
        if: github.event_name == 'pull_request'
        run: ./mvnw --batch-mode --no-transfer-progress clean test

      # Main/manual builds resolve dependencies through Nexus.
      - name: Run Maven tests through Nexus
        if: github.event_name != 'pull_request'
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          ./mvnw --batch-mode --no-transfer-progress \
            -s .mvn/nexus-settings.xml \
            clean test

      # Build the immutable versioned application JAR.
      - name: Build application JAR
        run: ./mvnw --batch-mode --no-transfer-progress package -DskipTests

      # Verify the expected JAR exists.
      - name: Verify application JAR
        run: |
          JAR_NAME="${SERVICE_NAME}-${APP_VERSION}.jar"
          test -f "target/${JAR_NAME}"
          echo "JAR_NAME=$JAR_NAME" >> "$GITHUB_ENV"
          echo "JAR verified: $JAR_NAME"

      # Analyze source code without enforcing the Quality Gate.
      - name: Run SonarQube analysis
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          ./mvnw --batch-mode --no-transfer-progress \
            -s .mvn/nexus-settings.xml \
            org.sonarsource.scanner.maven:sonar-maven-plugin:5.7.0.6970:sonar \
            -Dsonar.projectKey=boutique-productcatalogservice \
            -Dsonar.projectName="Boutique Product Catalog Service" \
            -Dsonar.projectVersion="${APP_VERSION}" \
            -Dsonar.host.url="${SONAR_HOST_URL}" \
            -Dsonar.token="${SONAR_TOKEN}"

      # Publish the same immutable version to Nexus releases.
      - name: Publish artifact to Nexus
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          ./mvnw --batch-mode --no-transfer-progress \
            -s .mvn/nexus-settings.xml \
            deploy \
            -DskipTests

      # Authenticate to AWS using GitHub OIDC.
      - name: Configure AWS credentials
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: productcatalog-${{ github.run_id }}
          allowed-account-ids: '663130434910'

      # Confirm which AWS role the workflow is using.
      - name: Verify AWS identity
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          aws sts get-caller-identity \
            --query '{Account:Account,Arn:Arn}' \
            --output table

      # Verify the expected ECR repository exists.
      - name: Verify ECR repository
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION" \
            --query 'repositories[0].repositoryUri' \
            --output text

      # Authenticate Docker with Amazon ECR.
      - name: Login to Amazon ECR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Build only the immutable application image.
      - name: Build Docker image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_REPOSITORY="${ECR_REGISTRY}/${ECR_REPOSITORY}"
          IMAGE_URI="${IMAGE_REPOSITORY}:${APP_VERSION}"

          echo "IMAGE_REPOSITORY=$IMAGE_REPOSITORY" >> "$GITHUB_ENV"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

          docker build \
            --label "org.opencontainers.image.version=${APP_VERSION}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "$IMAGE_URI" \
            .

      # Push only the immutable versioned image to ECR.
      - name: Push Docker image to ECR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: docker push --quiet "$IMAGE_URI"

      # Verify the immutable image exists before deployment.
      - name: Verify ECR image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$APP_VERSION" \
            --region "$AWS_REGION" \
            --query 'imageDetails[0].{Tags:imageTags,Digest:imageDigest,PushedAt:imagePushedAt}' \
            --output table

      # Install kubectl.
      - name: Setup kubectl
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: azure/setup-kubectl@v5.1.0

      # Install Helm.
      - name: Setup Helm
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: azure/setup-helm@v5.0.0

      # Checkout the public central platform repository.
      - name: Checkout platform repository
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PLATFORM_REPOSITORY }}
          path: boutique-platform-infra
          persist-credentials: false

      # Validate chart files and render manifests before cluster deployment.
      - name: Validate Helm chart
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          test -f "${HELM_CHART_PATH}/Chart.yaml"
          test -f "${HELM_CHART_PATH}/values.yaml"

          helm lint "$HELM_CHART_PATH"

          helm template "$HELM_RELEASE" "$HELM_CHART_PATH" \
            --namespace "$K8S_NAMESPACE" \
            --set image.repository="$IMAGE_REPOSITORY" \
            --set image.tag="$APP_VERSION" \
            > /tmp/productcatalog-rendered.yaml

          echo "Helm chart validation passed"

      # Configure kubectl for the Boutique EKS cluster.
      - name: Configure Amazon EKS
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

      # Verify Kubernetes authorization before deployment.
      - name: Verify EKS access
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          kubectl get namespace "$K8S_NAMESPACE" -o name
          test "$(kubectl auth can-i get deployments -n "$K8S_NAMESPACE")" = "yes"
          test "$(kubectl auth can-i patch deployments -n "$K8S_NAMESPACE")" = "yes"
          echo "EKS authorization verified"

      # Verify every existing Product Catalog resource belongs to productcatalog-dev.
      - name: Verify Helm resource ownership
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          RESOURCES=(
            "configmap/productcatalog-config"
            "secret/productcatalog-db-secret"
            "deployment/productcatalogservice"
            "service/productcatalogservice"
            "hpa/productcatalogservice-hpa"
            "pdb/productcatalogservice-pdb"
            "networkpolicy/productcatalogservice-network-policy"
            "serviceaccount/productcatalogservice-sa"
          )

          for resource in "${RESOURCES[@]}"; do
            if ! kubectl get "$resource" -n "$K8S_NAMESPACE" >/dev/null 2>&1; then
              echo "NEW: $resource will be created by Helm"
              continue
            fi

            MANAGED_BY="$(kubectl get "$resource" -n "$K8S_NAMESPACE" \
              -o jsonpath='{.metadata.labels.app\.kubernetes\.io/managed-by}')"

            RELEASE_NAME="$(kubectl get "$resource" -n "$K8S_NAMESPACE" \
              -o jsonpath='{.metadata.annotations.meta\.helm\.sh/release-name}')"

            RELEASE_NAMESPACE="$(kubectl get "$resource" -n "$K8S_NAMESPACE" \
              -o jsonpath='{.metadata.annotations.meta\.helm\.sh/release-namespace}')"

            if [[ "$MANAGED_BY" != "Helm" ||
                  "$RELEASE_NAME" != "$HELM_RELEASE" ||
                  "$RELEASE_NAMESPACE" != "$K8S_NAMESPACE" ]]; then
              echo "ERROR: $resource has incorrect Helm ownership"
              echo "Expected release  : $HELM_RELEASE"
              echo "Current release   : $RELEASE_NAME"
              echo "Managed by        : $MANAGED_BY"
              echo "Release namespace : $RELEASE_NAMESPACE"
              exit 1
            fi

            echo "OK: $resource -> $HELM_RELEASE"
          done

      # Show the image currently running before deployment.
      - name: Show current deployed image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          CURRENT_IMAGE="$(kubectl get deployment "$K8S_DEPLOYMENT" \
            -n "$K8S_NAMESPACE" \
            -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)"

          echo "Current image: ${CURRENT_IMAGE:-not deployed}"

      # Upgrade the existing productcatalog-dev Helm release with the new image.
      - name: Deploy Product Catalog with Helm
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          helm upgrade --install "$HELM_RELEASE" "$HELM_CHART_PATH" \
            --namespace "$K8S_NAMESPACE" \
            --set image.repository="$IMAGE_REPOSITORY" \
            --set image.tag="$APP_VERSION" \
            --wait \
            --rollback-on-failure \
            --timeout 5m

      # Wait until Kubernetes completes the rolling deployment.
      - name: Verify deployment rollout
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          kubectl rollout status \
            deployment/"$K8S_DEPLOYMENT" \
            -n "$K8S_NAMESPACE" \
            --timeout=180s

      # Verify Kubernetes uses exactly the image produced by this workflow.
      - name: Verify deployed image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          DEPLOYED_IMAGE="$(kubectl get deployment "$K8S_DEPLOYMENT" \
            -n "$K8S_NAMESPACE" \
            -o jsonpath='{.spec.template.spec.containers[0].image}')"

          echo "Expected: $IMAGE_URI"
          echo "Running : $DEPLOYED_IMAGE"

          test "$DEPLOYED_IMAGE" = "$IMAGE_URI"

      # Display only useful release and Kubernetes information.
      - name: Display deployment information
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          echo "----- Kubernetes -----"
          kubectl get deployment "$K8S_DEPLOYMENT" -n "$K8S_NAMESPACE" -o wide
          kubectl get pods -n "$K8S_NAMESPACE" -l app=productcatalogservice -o wide

          echo "----- Release -----"
          echo "Service        : ${SERVICE_NAME}"
          echo "Version        : ${APP_VERSION}"
          echo "Git Commit     : ${GITHUB_SHA}"
          echo "Nexus Artifact : ${JAR_NAME}"
          echo "ECR Image      : ${IMAGE_URI}"
          echo "Helm Release   : ${HELM_RELEASE}"
          echo "Helm Image Tag : ${APP_VERSION}"
          echo "EKS Image      : ${IMAGE_URI}"