# CI workflow for the Boutique Product Catalog Service.
# It validates the code, creates a versioned JAR, performs SonarQube analysis,
# and publishes the final Maven artifact to Nexus.

name: Product Catalog CI

on:
  # Run automatically whenever code is pushed to the main branch.
  push:
    branches:
      - main

  # Validate changes before they are merged into main.
  pull_request:
    branches:
      - main

  # Allow engineers to manually trigger the pipeline from GitHub Actions.
  workflow_dispatch:

jobs:
  build-test-nexus-sonar:

    # GitHub provides a fresh temporary Ubuntu runner for this job.
    runs-on: ubuntu-latest

    steps:
      # Download the repository source code onto the GitHub runner.
      - name: Checkout source code
        uses: actions/checkout@v4

      # Install Java 21 and enable Maven dependency caching on the runner.
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Linux runners require the Maven wrapper to have execute permission.
      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      # Create a unique application version for every GitHub Actions run.
      # Example: GitHub run 25 produces version 1.0.25.
      # GITHUB_ENV makes APP_VERSION available to all following steps.
      - name: Generate application version
        run: |
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Application version: $VERSION"

      # Replace the POM version only inside this temporary CI runner.
      # The repository's original pom.xml is not committed or modified in Git.
      - name: Set Maven artifact version
        run: |
          ./mvnw versions:set \
            -DnewVersion="${APP_VERSION}" \
            -DgenerateBackupPoms=false

      # Execute automated tests before creating/publishing the artifact.
      # A real test failure stops the workflow here.
      - name: Run Maven tests
        run: ./mvnw clean test

      # Package the compiled application into a versioned executable JAR.
      # Tests are skipped here because they already ran in the previous step.
      - name: Build application JAR
        run: ./mvnw package -DskipTests

      # Send source-code analysis to the dedicated Product Catalog project
      # in SonarQube. We are NOT enforcing the Sonar Quality Gate yet.
      #
      # Nexus settings are used so Maven dependencies continue to resolve
      # through our Nexus repository instead of directly from Maven Central.
      - name: Run SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          ./mvnw \
            -s .mvn/nexus-settings.xml \
            sonar:sonar \
            -Dsonar.projectKey=boutique-productcatalogservice \
            -Dsonar.projectName="Boutique Product Catalog Service" \
            -Dsonar.host.url="${SONAR_HOST_URL}" \
            -Dsonar.token="${SONAR_TOKEN}"

      # Publish the versioned Maven artifact to Nexus.
      # Because APP_VERSION is a release-style version (for example 1.0.25),
      # Maven distributionManagement sends it to maven-releases.
      - name: Publish artifact to Nexus
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          ./mvnw \
            -s .mvn/nexus-settings.xml \
            deploy \
            -DskipTests

      # Print important artifact information for easy troubleshooting
      # and traceability in the GitHub Actions logs.
      - name: Display build information
        run: |
          echo "Service       : productcatalogservice"
          echo "Version       : ${APP_VERSION}"
          echo "Nexus artifact: productcatalogservice-${APP_VERSION}.jar"