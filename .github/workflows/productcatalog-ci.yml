name: Product Catalog CI

on:
  # Automatically run when code is pushed to main
  push:
    branches:
      - main

  # Automatically validate pull requests targeting main
  pull_request:
    branches:
      - main

  # Allow us to run the workflow manually from GitHub Actions UI
  workflow_dispatch:

jobs:
  build-test-nexus:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run Maven tests
        run: ./mvnw clean test

      - name: Build application JAR
        run: ./mvnw package -DskipTests

      - name: Publish artifact to Nexus
        run: |
          ./mvnw \
            -s .mvn/nexus-settings.xml \
            deploy \
            -DskipTests
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}